<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="/traitment" method="post" enctype="multipart/form-data">
      <fieldset>
        <legend>Identité et Sécurité</legend>
        <label for="inscription_web"></label>
        <input type="hidden" id="inscription_web" name="source" />
        <label for="name">Nom</label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="DUPONT"
          required
          autofocus
        />
        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" name="mdp" minlength="8" />
        <label for="pp">Photo de profil</label>
        <input type="file" id="pp" name="pp" accept=".png, .PNG, .jpg, .JPG" />
      </fieldset>
      <fieldset>
        <legend>Profil et Contact</legend>
        <label for="email">Adresse email</label>
        <input type="email" name="email" id="email" required />
        <label for="tel">numéro de téléphone</label>
        <input type="tel" name="tel" id="tel" pattern="[0-9]{10}" />
        <label for="site">Site web ou Portfolio</label>
        <input type="url" name="site" id="site" />
        <label for="couleur"></label>
        <input type="color" name="couleur" id="couleur" value="#8BB196" />
      </fieldset>
      <fieldset>
        <legend>Information Professionnelle</legend>
        <label for="age">Age</label>
        <input type="number" name="age" id="age" min="0" max="50" />
        <label for="tjm">Taux journalier moyen</label>
        <input type="number" name="tjm" id="tjm" step="50" />
        <label for="senior">Niveau de séniorité estimé</label>
        <input type="range" name="senior" id="senior" min="1" max="5" />
        <label for="langue">Langues maîtrisées</label>
        <input
          type="checkbox"
          name="langue"
          id="langue"
          value="fr"
          checked
        />Français
        <input type="checkbox" name="langue" id="langue" value="uk" />Anglais
        <input type="checkbox" name="langue" id="langue" value="es" />Espagnol
        <input type="checkbox" name="langue" id="langue" value="tr" />Turc
        <label for="statut">Statut juridique</label>
        <input
          type="radio"
          name="statut"
          id="statut"
          value="Auto-entrepreneur"
        />Auto-entrepreneur
        <input type="radio" name="statut" id="statut" value="SASU" />SASU
        <input type="radio" name="statut" id="statut" value="EURL" />EURL
        <label for="region">Région d'intervention</label>
        <select name="region" id="region">
          <option>Groupe Nord</option>
          <option>Groupe Sud</option>
          <option>Groupe Ouest</option>
          <option>Groupe Est</option>
        </select>
      </fieldset>
      <fieldset>
        <legend>Disponibilité et Finalisation</legend>
      </fieldset>
      <fieldset>
        <legend></legend>
      </fieldset>
    </form>
  </body>
</html>
